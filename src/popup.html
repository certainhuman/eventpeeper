<!doctype html>
<!--suppress CssUnresolvedCustomProperty, CssUnusedSymbol -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Event Peeper</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            min-width: 365px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 7px 12px;
            border-radius: 12px;
            background: color-mix(in oklab, CanvasText 6%, Canvas);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 0 0 1px color-mix(in oklab, CanvasText 10%, transparent);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: saturate(1.2) blur(6px);
            gap: 12px;
        }

        h1 {
            font-size: 17px;
            margin: 0;
            letter-spacing: 0.8px;
            font-weight: 800;
            white-space: nowrap;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            opacity: 0.7;
            flex: 1;
        }

        .header-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .page-tabs {
            display: flex;
            gap: 3px;
            margin-left: auto;
        }
        .page-tab {
            border: 0;
            border-radius: 6px;
            padding: 4px 7px;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 10px;
            cursor: pointer;
            opacity: 0.6;
        }
        .page-tab.active {
            background: color-mix(in oklab, CanvasText 12%, Canvas);
            opacity: 1;
        }
        .page.hidden {
            display: none;
        }

        .header-separator {
            width: 1px;
            height: 14px;
            background: color-mix(in oklab, CanvasText 20%, transparent);
        }

        .last-update {
            font-variant-numeric: tabular-nums;
        }

        /* Cards layout */
        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .section-title {
            margin: 14px 2px 6px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .next-mission {
            margin-top: 8px;
            font-size: 11px;
        }
        .pvp-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 10px;
            border: 1px solid color-mix(in oklab, CanvasText 12%, transparent);
            border-radius: 8px;
            font-size: 12px;
        }
        .pvp-event-info {
            min-width: 0;
        }
        .pvp-event-server {
            font-weight: 700;
        }
        .pvp-event-time {
            margin-top: 3px;
            font-size: 10px;
        }
        .pvp-event-countdown {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            white-space: nowrap;
        }
        .pvp-event-label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.65;
        }
        .pvp-event-value {
            margin-top: 2px;
            font-size: 15px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: CanvasText;
        }

        .card {
            border: 1px solid var(--card-border, rgba(0, 0, 0, 0.12));
            border-radius: 12px;
            padding: 10px 12px;
            background: var(--card-bg, rgba(255, 255, 255, 0.03));
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            transition: border-color 120ms, background 120ms, transform 120ms;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            opacity: var(--bg-opacity, 0.7);
            filter: saturate(0.9);
            pointer-events: none;
        }

        @media (prefers-color-scheme: light) {
            .card::before {
                filter: saturate(1.2) brightness(0.95);
            }

            .card[style*="--bg-image"] {
                color: white;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            }

            .card[style*="--bg-image"] .card-title,
            .card[style*="--bg-image"] .event-name,
            .card[style*="--bg-image"] .card-meta {
                color: white;
            }
        }

        .card {
            transition: background 180ms ease,
            border-color 180ms ease,
            box-shadow 180ms ease,
            transform 180ms ease;
        }

        .card:hover {
            background: color-mix(in oklab, var(--accent) 6%, Canvas);
            border-color: var(--accent);
            box-shadow: 0 3px 10px color-mix(in oklab, var(--accent) 35%, transparent);
        }

        .card:hover::before {
            filter: saturate(1.005) brightness(1.005);
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-weight: 700;
            margin: 0 0 4px;
            font-size: 13px;
            opacity: 0.95;
        }
        .instance-separator {
            display: flex;
            align-items: center;
            gap: 8px;
            grid-column: 1 / -1;
            min-height: 10px;
            margin: 4px 2px 2px;
            color: #7f8c8d;
            font-size: 9px;
            line-height: 1;
            letter-spacing: 0.8px;
            text-align: center;
        }
        .instance-separator::before,
        .instance-separator::after {
            content: "";
            height: 1px;
            flex: 1;
            background: color-mix(in oklab, currentColor 35%, transparent);
        }

        .card-meta {
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.75;
        }

        /* State accents */
        .card.state-open {
            border-color: #2ecc71;
        }

        .card.state-announced {
            border-color: #f1c40f;
        }

        .card.state-closed {
            border-color: #e74c3c;
        }

        .card.state-checking {
            border-color: #3498db;
            border-style: dashed;
        }

        .card.state-loading {
            border-style: dashed;
            opacity: 0.8;
        }

        .card.state-error {
            border-color: #e74c3c;
        }
        .card.state-inactive {
            border-color: #7f8c8d;
            --accent: #7f8c8d;
            background: color-mix(in oklab, CanvasText 8%, Canvas);
        }
        .card.state-inactive::before {
            background-image: repeating-linear-gradient(
                135deg,
                transparent 0,
                transparent 10px,
                color-mix(in oklab, CanvasText 7%, transparent) 10px,
                color-mix(in oklab, CanvasText 7%, transparent) 11px
            );
            opacity: 0.7;
        }
        .card.state-closed::before {
            background-image: repeating-linear-gradient(
                135deg,
                transparent 0,
                transparent 10px,
                color-mix(in oklab, #e74c3c 24%, transparent) 10px,
                color-mix(in oklab, #e74c3c 24%, transparent) 11px
            );
            opacity: 0.7;
        }
        .card.state-inactive .ring-track {
            stroke: #687477;
            opacity: 0.7;
        }
        .card.state-inactive .ring-progress {
            stroke: #9aa8ab;
        }

        /* Header with countdown */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header-left {
            min-width: 0;
        }

        .event-name {
            font-size: 18px;
            font-weight: 800;
            margin: 2px 0 6px;
            letter-spacing: 0.2px;
        }

        .countdown-wrap {
            width: 80px;
            height: 80px;
            position: relative;
            flex: 0 0 auto;
        }

        .countdown-wrap svg {
            width: 80px;
            height: 80px;
            display: block;
        }

        .ring-track {
            stroke: color-mix(in oklab, currentColor 25%, transparent);
            opacity: 0.35;
        }

        .ring-progress {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.2s linear;
        }

        .countdown-text {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
        }
        .countdown-label {
            position: absolute;
            top: 23px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 7px;
            line-height: 1;
            font-weight: 600;
            opacity: 0.75;
            pointer-events: none;
        }

        /* State color variables */
        .card {
            --accent: #7f8c8d;
            color: inherit;
        }

        .card.state-open {
            --accent: #2ecc71;
        }

        .card.state-announced {
            --accent: #f1c40f;
        }

        .card.state-closed {
            --accent: #e74c3c;
        }

        .card.state-checking {
            --accent: #3498db;
        }

        .card.state-error {
            --accent: #e74c3c;
        }

        .ring-progress {
            stroke: var(--accent);
        }

        .ring-track {
            stroke: currentColor;
        }

        #error {
            color: #c0392b;
            white-space: pre-wrap;
            display: none;
            margin-bottom: 8px;
        }

        #content.loading {
            opacity: 0.6;
        }

        .muted {
            opacity: 0.8;
        }

        /* Header polish */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modern refresh button */
        /* Ensure no unexpected fills inside the SVGs (default fill is black) */
        #refreshBtn svg {
            fill: none;
        }

        #refreshBtn {
            --btn-bg: color-mix(in oklab, CanvasText 8%, Canvas);
            --btn-fg: color-mix(in oklab, CanvasText 92%, transparent);
            --btn-accent: #2ecc71;
            appearance: none;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-fg);
            width: 32px;
            height: 32px;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px color-mix(in oklab, CanvasText 12%, transparent);
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
        }

        #refreshBtn:hover {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16), inset 0 0 0 1px color-mix(in oklab, CanvasText 18%, transparent);
        }

        #refreshBtn:active {
            transform: translateY(2px) scale(0.98);
        }

        #refreshBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #refreshBtn:disabled:hover {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px color-mix(in oklab, CanvasText 12%, transparent);
            transform: none;
        }

        #refreshBtn:disabled:active {
            transform: none;
        }

        #refreshBtn .icon {
            width: 16px;
            height: 16px;
            display: block;
        }

        /* Spin animation when content is loading */
        header.loading #refreshBtn .icon {
            animation: spin 0.6s linear infinite;
        }

        /* Finish-the-lap behavior: when loading ends mid-rotation, keep spinning until the current turn completes; show check immediately */
        header.loading-done #refreshBtn .icon {
            animation: spin 0.6s linear infinite;
        }

        #refreshBtn {
            position: relative;
        }

        #refreshBtn .check {
            display: none;
            width: 12px;
            height: 12px;
            position: absolute;
            right: -2px;
            bottom: -2px;
            background: Canvas;
            border-radius: 999px;
            box-shadow: 0 0 0 2px var(--btn-bg);
        }

        header.loaded #refreshBtn .check {
            display: block;
            color: var(--btn-accent);
        }

        @keyframes spin {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }

        small {
            font-size: 11px;
        }

        /* Credits row: simple small text near bottom */
        .credits {
            margin: 12px 0 4px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .credits .left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: color-mix(in oklab, currentColor 70%, transparent);
        }

        .credits .right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .credits a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dotted currentColor;
        }

        .credits a:hover {
            border-bottom-style: solid;
        }

        .credits .badge {
            display: none;
        }
    </style>
</head>
<body>
<header>
    <h1>Event Peeper</h1>
    <div class="header-info">
        <div class="header-separator"></div>
        <div class="header-info-item">
            <span class="last-update" id="lastUpdate">—</span>
        </div>
        <div class="header-separator"></div>
        <div class="header-info-item">
            <span id="activeEvents">—</span>
        </div>
    </div>
    <div class="page-tabs" role="tablist">
        <button class="page-tab active" id="missionsTab" role="tab" aria-selected="true">Missions</button>
        <button class="page-tab" id="pvpTab" role="tab" aria-selected="false">PvP Events</button>
    </div>
    <div class="header-actions">
        <button aria-label="Refresh" id="refreshBtn" title="Refresh now">
            <svg aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
            <svg aria-hidden="true" class="check" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </button>
    </div>
</header>

    <div id="error"></div>

<div class="loading" id="content">
    <div class="page" id="missionsPage">
    <div class="cards" id="serverRows"></div>
    </div>
    <div class="page hidden" id="pvpPage">
    <div class="cards" id="pvpRows"></div>
    </div>
    <div class="credits">
        <div class="left">
            <small class="muted" id="apiUrlText">Data from dsa-api.certainhuman.com</small>
        </div>
        <div class="right">
            <small class="muted" id="versionText" style="margin-right: 8px;">v2.0.0</small>
            <small>by <a href="https://github.com/certainhuman/" rel="noopener noreferrer"
                         target="_blank">HaveFun</a></small>
        </div>
    </div>
</div>

<script src="v2-model.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
