<!doctype html>
<!--suppress CssUnresolvedCustomProperty, CssUnusedSymbol -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Event Peeper</title>
    <style>
        :root {
            color-scheme: light dark;

            /* State accents. Light mode uses deeper variants so borders and
               rings keep the same meaning against a white canvas. */
            --state-open: #12a150;
            --state-announced: #b7860a;
            --state-closed: #d43f2f;
            --state-checking: #1f7fd0;
            --state-inactive: #6b7778;

            /* Surfaces. Light mode lifts controls off the page with white
               fills and real shadows; dark mode tints them instead. */
            --card-bg: color-mix(in oklab, CanvasText 2%, Canvas);
            --card-border: color-mix(in oklab, CanvasText 14%, transparent);
            --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
            --tab-active-bg: Canvas;
            --tab-active-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
            --btn-surface: Canvas;

            /* Card artwork. Shown at full strength in light mode — blending it
               toward the white canvas is what washes the colours out. Legibility
               comes from the scrim below instead, which darkens without desaturating. */
            --bg-opacity: 1;
            --bg-filter: saturate(1.05);
            --bg-filter-hover: saturate(1.15) brightness(1.05);

            /* Scrim: shades the left column where the text sits and fades off
               before the art does, plus a halo under the countdown ring. */
            --art-scrim: linear-gradient(90deg,
            rgba(8, 10, 12, 0.66) 0%,
            rgba(8, 10, 12, 0.5) 40%,
            rgba(8, 10, 12, 0.26) 72%,
            rgba(8, 10, 12, 0.22) 100%);
            --art-halo: radial-gradient(circle,
            rgba(8, 10, 12, 0.42) 28%,
            rgba(8, 10, 12, 0.3) 52%,
            rgba(8, 10, 12, 0.12) 74%,
            rgba(8, 10, 12, 0) 100%);
            --art-text: #fff;
            --art-text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --state-open: #2ecc71;
                --state-announced: #f1c40f;
                --state-closed: #e74c3c;
                --state-checking: #3498db;
                --state-inactive: #7f8c8d;

                --card-bg: rgba(255, 255, 255, 0.03);
                --card-border: rgba(255, 255, 255, 0.12);
                --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
                --tab-active-bg: color-mix(in oklab, CanvasText 12%, Canvas);
                --tab-active-shadow: none;
                --btn-surface: color-mix(in oklab, CanvasText 8%, Canvas);

                /* Dark mode composites the art over a dark card, which darkens
                   it on its own — no scrim needed, and CanvasText is already light. */
                --bg-opacity: 0.7;
                --bg-filter: saturate(0.9);
                --bg-filter-hover: saturate(1.005) brightness(1.005);
                --art-scrim: none;
                --art-halo: none;
                --art-text: CanvasText;
                --art-text-shadow: none;
            }
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            min-width: 365px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 7px 12px;
            border-radius: 12px;
            background: color-mix(in oklab, CanvasText 6%, Canvas);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 0 0 1px color-mix(in oklab, CanvasText 10%, transparent);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: saturate(1.2) blur(6px);
            gap: 12px;
        }

        h1 {
            font-size: 17px;
            margin: 0;
            letter-spacing: 0.8px;
            font-weight: 800;
            white-space: nowrap;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            opacity: 0.7;
            flex: 1;
        }

        .header-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .page-tabs {
            display: flex;
            gap: 3px;
            margin-left: auto;
        }
        .page-tab {
            border: 0;
            border-radius: 6px;
            padding: 4px 7px;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 10px;
            cursor: pointer;
            opacity: 0.6;
        }
        .page-tab.active {
            background: var(--tab-active-bg);
            box-shadow: var(--tab-active-shadow);
            opacity: 1;
        }
        .page.hidden {
            display: none;
        }

        .header-separator {
            width: 1px;
            height: 14px;
            background: color-mix(in oklab, CanvasText 20%, transparent);
        }

        .last-update {
            font-variant-numeric: tabular-nums;
        }

        /* Cards layout */
        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .section-title {
            margin: 14px 2px 6px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .next-mission {
            margin-top: 8px;
            font-size: 11px;
        }
        .pvp-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 10px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            font-size: 12px;
        }
        .pvp-event-info {
            min-width: 0;
        }
        .pvp-event-server {
            font-weight: 700;
        }
        .pvp-event-time {
            margin-top: 3px;
            font-size: 10px;
        }
        .pvp-event-countdown {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            white-space: nowrap;
        }
        .pvp-event-label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.65;
        }
        .pvp-event-value {
            margin-top: 2px;
            font-size: 15px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: CanvasText;
        }

        .card {
            --accent: var(--state-inactive);
            color: inherit;
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 10px 12px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: background 180ms ease,
            border-color 180ms ease,
            box-shadow 180ms ease,
            transform 180ms ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--bg-image, none);
            background-size: cover;
            background-position: center;
            opacity: var(--bg-opacity);
            filter: var(--bg-filter);
            pointer-events: none;
            transition: filter 180ms ease;
        }

        .card[style*="--bg-image"]::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--art-scrim);
            pointer-events: none;
        }

        .card[style*="--bg-image"] {
            color: var(--art-text);
            text-shadow: var(--art-text-shadow);
        }

        .card[style*="--bg-image"] .countdown-wrap {
            background: var(--art-halo);
        }

        .card:hover {
            background: color-mix(in oklab, var(--accent) 6%, Canvas);
            border-color: var(--accent);
            box-shadow: 0 3px 10px color-mix(in oklab, var(--accent) 35%, transparent);
        }

        .card:hover::before {
            filter: var(--bg-filter-hover);
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-weight: 700;
            margin: 0 0 4px;
            font-size: 13px;
            opacity: 0.95;
        }
        .instance-separator {
            display: flex;
            align-items: center;
            gap: 8px;
            grid-column: 1 / -1;
            min-height: 10px;
            margin: 4px 2px 2px;
            color: var(--state-inactive);
            font-size: 9px;
            line-height: 1;
            letter-spacing: 0.8px;
            text-align: center;
        }
        .instance-separator::before,
        .instance-separator::after {
            content: "";
            height: 1px;
            flex: 1;
            background: color-mix(in oklab, currentColor 35%, transparent);
        }

        .card-meta {
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.75;
        }

        .card.state-open {
            --accent: var(--state-open);
        }

        .card.state-announced {
            --accent: var(--state-announced);
        }

        .card.state-closed {
            --accent: var(--state-closed);
        }

        .card.state-checking {
            --accent: var(--state-checking);
            border-style: dashed;
        }

        .card.state-loading {
            border-style: dashed;
            opacity: 0.8;
        }

        .card.state-error {
            --accent: var(--state-closed);
        }
        .card.state-inactive {
            --accent: var(--state-inactive);
            background: color-mix(in oklab, CanvasText 8%, Canvas);
        }
        .card.state-inactive::before {
            background-image: repeating-linear-gradient(
                135deg,
                transparent 0,
                transparent 10px,
                color-mix(in oklab, CanvasText 7%, transparent) 10px,
                color-mix(in oklab, CanvasText 7%, transparent) 11px
            );
            opacity: 0.7;
        }
        .card.state-closed::before {
            background-image: repeating-linear-gradient(
                135deg,
                transparent 0,
                transparent 10px,
                color-mix(in oklab, var(--state-closed) 24%, transparent) 10px,
                color-mix(in oklab, var(--state-closed) 24%, transparent) 11px
            );
            opacity: 0.7;
        }
        .card.state-inactive .ring-track {
            stroke: color-mix(in oklab, var(--state-inactive) 45%, transparent);
            opacity: 0.7;
        }
        .card.state-inactive .ring-progress {
            stroke: color-mix(in oklab, var(--state-inactive) 80%, CanvasText);
        }

        /* Header with countdown */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header-left {
            min-width: 0;
        }

        .event-name {
            font-size: 18px;
            font-weight: 800;
            margin: 2px 0 6px;
            letter-spacing: 0.2px;
        }

        .countdown-wrap {
            width: 80px;
            height: 80px;
            position: relative;
            flex: 0 0 auto;
        }

        .countdown-wrap svg {
            width: 80px;
            height: 80px;
            display: block;
        }

        .ring-track {
            stroke: color-mix(in oklab, currentColor 35%, transparent);
        }

        .ring-progress {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.2s linear;
        }

        .countdown-text {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
        }
        .countdown-label {
            position: absolute;
            top: 23px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 7px;
            line-height: 1;
            font-weight: 600;
            opacity: 0.75;
            pointer-events: none;
        }

        .ring-progress {
            stroke: var(--accent);
        }

        #error {
            color: var(--state-closed);
            white-space: pre-wrap;
            display: none;
            margin-bottom: 8px;
        }

        #content.loading {
            opacity: 0.6;
        }

        .muted {
            opacity: 0.8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #refreshBtn svg {
            fill: none;
        }

        #refreshBtn {
            --btn-bg: var(--btn-surface);
            --btn-fg: color-mix(in oklab, CanvasText 92%, transparent);
            --btn-accent: var(--state-open);
            appearance: none;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-fg);
            width: 32px;
            height: 32px;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px color-mix(in oklab, CanvasText 12%, transparent);
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
        }

        #refreshBtn:hover {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16), inset 0 0 0 1px color-mix(in oklab, CanvasText 18%, transparent);
        }

        #refreshBtn:active {
            transform: translateY(2px) scale(0.98);
        }

        #refreshBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #refreshBtn:disabled:hover {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px color-mix(in oklab, CanvasText 12%, transparent);
            transform: none;
        }

        #refreshBtn:disabled:active {
            transform: none;
        }

        #refreshBtn .icon {
            width: 16px;
            height: 16px;
            display: block;
        }

        /* Spin animation when content is loading */
        header.loading #refreshBtn .icon {
            animation: spin 0.6s linear infinite;
        }

        /* when loading ends mid-rotation, keep spinning until the current turn completes; show check immediately */
        header.loading-done #refreshBtn .icon {
            animation: spin 0.6s linear infinite;
        }

        #refreshBtn {
            position: relative;
        }

        #refreshBtn .check {
            display: none;
            width: 12px;
            height: 12px;
            position: absolute;
            right: -2px;
            bottom: -2px;
            background: Canvas;
            border-radius: 999px;
            box-shadow: 0 0 0 2px var(--btn-bg);
        }

        header.loaded #refreshBtn .check {
            display: block;
            color: var(--btn-accent);
        }

        @keyframes spin {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }

        small {
            font-size: 11px;
        }

        .credits {
            margin: 12px 0 4px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .credits .left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: color-mix(in oklab, currentColor 70%, transparent);
        }

        .credits .right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .credits a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dotted currentColor;
        }

        .credits a:hover {
            border-bottom-style: solid;
        }

        .credits .badge {
            display: none;
        }
    </style>
</head>
<body>
<header>
    <h1>Event Peeper</h1>
    <div class="header-info">
        <div class="header-separator"></div>
        <div class="header-info-item">
            <span class="last-update" id="lastUpdate">—</span>
        </div>
        <div class="header-separator"></div>
        <div class="header-info-item">
            <span id="activeEvents">—</span>
        </div>
    </div>
    <div class="page-tabs" role="tablist">
        <button class="page-tab active" id="missionsTab" role="tab" aria-selected="true">Missions</button>
        <button class="page-tab" id="pvpTab" role="tab" aria-selected="false">PvP Events</button>
    </div>
    <div class="header-actions">
        <button aria-label="Refresh" id="refreshBtn" title="Refresh now">
            <svg aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
            <svg aria-hidden="true" class="check" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </button>
    </div>
</header>

    <div id="error"></div>

<div class="loading" id="content">
    <div class="page" id="missionsPage">
    <div class="cards" id="serverRows"></div>
    </div>
    <div class="page hidden" id="pvpPage">
    <div class="cards" id="pvpRows"></div>
    </div>
    <div class="credits">
        <div class="left">
            <small class="muted" id="apiUrlText">Data from dsa-api.certainhuman.com</small>
        </div>
        <div class="right">
            <small class="muted" id="versionText" style="margin-right: 8px;">v2.0.0</small>
            <small>by <a href="https://github.com/certainhuman/" rel="noopener noreferrer"
                         target="_blank">HaveFun</a></small>
        </div>
    </div>
</div>

<script src="v2-model.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
